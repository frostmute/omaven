<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f1726"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c2d"/>
      <stop offset="100%" stop-color="#0b111c"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="280" fill="url(#glowGrad)" filter="url(#softGlow)"/>
  <circle cx="1000" cy="400" r="320" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- ================= LEFT: BRANDING & HIGHLIGHTS ================= -->
  <g transform="translate(80, 80)">
    <!-- App Icon Emblem -->
    <rect x="0" y="0" width="68" height="68" rx="16" fill="url(#cyanAccent)"/>
    <path d="M22 35 L30 43 L48 24" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Category Pill -->
    <rect x="84" y="16" width="138" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="153" y="34" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">OMARCHY PLUGIN</text>

    <!-- Main Title -->
    <text x="0" y="130" font-family="Inter, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">OMAVEN</text>
    
    <!-- Subtitle -->
    <text x="0" y="165" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="2">LOCAL-FIRST AVEN TASKS</text>

    <!-- Description -->
    <text x="0" y="210" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8">
      <tspan x="0" dy="0">Instant status popup on the Omarchy bar,</tspan>
      <tspan x="0" dy="28">and a dedicated floating or tiling desktop</tspan>
      <tspan x="0" dy="28">window inside Hyprland.</tspan>
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 310)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="65" y="21" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">Bar Popup</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="32" rx="8" fill="#31104b" stroke="#9333ea" stroke-width="1"/>
      <text x="214" y="21" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">Hyprland Tiling</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="130" height="32" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="364" y="21" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">Synced &amp; E2EE</text>
    </g>

    <!-- Keybinding Badges -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="430" height="56" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      
      <text x="18" y="34" font-family="JetBrains Mono, monospace" font-size="13" fill="#64748b">LAUNCH</text>
      
      <rect x="76" y="12" width="142" height="30" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="147" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Middle-Click / ↗</text>
      <text x="235" y="34" font-family="JetBrains Mono, monospace" font-size="13" fill="#64748b">TILE/FLOAT</text>
      
      <rect x="330" y="12" width="85" height="30" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="372" y="32" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Super + T</text>
    </g>
  </g>

  <!-- ================= RIGHT: UI MOCKUP SHOWCASE ================= -->
  <g transform="translate(630, 60)">
    <!-- Desktop Window Frame (Backdrop) -->
    <rect x="0" y="40" width="570" height="480" rx="14" fill="url(#winGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Titlebar -->
    <rect x="0" y="40" width="570" height="40" rx="14" fill="#0f172a"/>
    <circle cx="24" cy="60" r="5" fill="#ef4444"/>
    <circle cx="40" cy="60" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="60" r="5" fill="#10b981"/>
    <text x="285" y="65" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Omaven — Aven Task Manager</text>

    <!-- Window Sidebar Mockup -->
    <rect x="0" y="80" width="145" height="440" fill="#090e17"/>
    <line x1="145" y1="80" x2="145" y2="520" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Sidebar Items -->
    <rect x="10" y="96" width="125" height="26" rx="6" fill="#2563eb"/>
    <text x="24" y="113" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">All Open</text>
    <text x="122" y="113" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">50</text>

    <text x="24" y="145" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Active</text>
    <text x="122" y="145" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">0</text>

    <text x="24" y="172" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Todo</text>
    <text x="122" y="172" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">40</text>

    <text x="24" y="199" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Backlog</text>
    <text x="122" y="199" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">10</text>

    <!-- Sidebar Projects -->
    <text x="16" y="245" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#475569">PROJECTS</text>
    <text x="24" y="272" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">HABITEX</text>
    <text x="122" y="272" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">26</text>
    <text x="24" y="296" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">SYSTEM</text>
    <text x="122" y="296" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">15</text>
    <text x="24" y="320" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">NEXORA</text>
    <text x="122" y="320" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">2</text>

    <!-- ================= FLOATING BAR POPUP CARD ================= -->
    <g transform="translate(180, 20)">
      <!-- Anchored Bar Slot Mockup -->
      <rect x="230" y="-12" width="70" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="245" y="4" font-family="JetBrains Mono, monospace" font-size="13" fill="#38bdf8">󰄲</text>
      <!-- Badge -->
      <rect x="272" y="-18" width="22" height="15" rx="7.5" fill="#f97316"/>
      <text x="283" y="-7" font-family="JetBrains Mono, monospace" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">50</text>

      <!-- Popup Container with Shadow -->
      <rect x="0" y="22" width="340" height="470" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
      
      <!-- Popup Header -->
      <text x="18" y="52" font-family="JetBrains Mono, monospace" font-size="16" fill="#38bdf8">󰄲</text>
      <text x="40" y="52" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Omaven</text>

      <!-- Synced Pill -->
      <rect x="105" y="38" width="68" height="18" rx="9" fill="#14532d"/>
      <text x="139" y="51" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">Synced</text>

      <!-- Action icons -->
      <text x="268" y="52" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">󰑐</text>
      <text x="290" y="52" font-family="JetBrains Mono, monospace" font-size="13" fill="#38bdf8">↗</text>
      <text x="312" y="52" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">✕</text>

      <!-- Search Input Bar -->
      <rect x="18" y="68" width="304" height="32" rx="6" fill="#0b111c" stroke="#1e293b" stroke-width="1"/>
      <text x="30" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Filter or type task + Enter...</text>
      <text x="306" y="89" font-family="JetBrains Mono, monospace" font-size="13" fill="#38bdf8">󰐕</text>

      <!-- Filter Pills Row -->
      <rect x="18" y="110" width="58" height="20" rx="5" fill="#0284c7"/>
      <text x="47" y="124" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Open 50</text>

      <rect x="80" y="110" width="56" height="20" rx="5" fill="#1e293b"/>
      <text x="108" y="124" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Todo 40</text>

      <rect x="140" y="110" width="60" height="20" rx="5" fill="#1e293b"/>
      <text x="170" y="124" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Backlog 10</text>

      <rect x="204" y="110" width="54" height="20" rx="5" fill="#1e293b"/>
      <text x="231" y="124" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Done 20</text>

      <!-- Task Row 1 -->
      <g transform="translate(18, 142)">
        <rect x="0" y="0" width="304" height="66" rx="8" fill="#131c2d" stroke="#1e293b" stroke-width="1"/>
        <rect x="12" y="14" width="18" height="18" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
        <path d="M16 23 L20 27 L26 18" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
        <rect x="38" y="12" width="38" height="16" rx="3" fill="#1e293b"/>
        <text x="57" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">HBT</text>
        <text x="82" y="24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#38bdf8">HBT-5412</text>
        <text x="38" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">Reconcile legal citations...</text>
      </g>

      <!-- Task Row 2 -->
      <g transform="translate(18, 216)">
        <rect x="0" y="0" width="304" height="66" rx="8" fill="#131c2d" stroke="#1e293b" stroke-width="1"/>
        <rect x="12" y="14" width="18" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <rect x="38" y="12" width="38" height="16" rx="3" fill="#1e293b"/>
        <text x="57" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">SYS</text>
        <text x="82" y="24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#38bdf8">SYS-6AF4</text>
        <text x="38" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">Bulletin board coordination...</text>
      </g>

      <!-- Task Row 3 -->
      <g transform="translate(18, 290)">
        <rect x="0" y="0" width="304" height="66" rx="8" fill="#131c2d" stroke="#1e293b" stroke-width="1"/>
        <rect x="12" y="14" width="18" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <rect x="38" y="12" width="38" height="16" rx="3" fill="#1e293b"/>
        <text x="57" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">UND</text>
        <text x="82" y="24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#38bdf8">UND-TA1K</text>
        <text x="38" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">Adapt opening lighting...</text>
      </g>

      <!-- Task Row 4 -->
      <g transform="translate(18, 364)">
        <rect x="0" y="0" width="304" height="66" rx="8" fill="#131c2d" stroke="#1e293b" stroke-width="1"/>
        <rect x="12" y="14" width="18" height="18" rx="4" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>
        <polygon points="17,19 25,23 17,27" fill="#fb923c"/>
        <rect x="38" y="12" width="38" height="16" rx="3" fill="#1e293b"/>
        <text x="57" y="24" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">NXR</text>
        <text x="82" y="24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#38bdf8">NXR-5QGC</text>
        <text x="38" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">Autonomous mission step...</text>
      </g>

      <!-- Popup Footer -->
      <line x1="18" y1="444" x2="322" y2="444" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="460" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">50 tasks · 4 projects</text>
      <text x="322" y="460" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="end">↗ Pop out to window</text>
    </g>
  </g>

  <!-- ================= BOTTOM BADGE / STATS BAR ================= -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1120" height="52" rx="10" fill="#0d1422" stroke="#1e293b" stroke-width="1"/>
    
    <g transform="translate(24, 31)">
      <text font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#38bdf8">󰄲 OMAVEN</text>
      <text x="90" y="0" font-family="Inter, sans-serif" font-size="13" fill="#64748b">· Built for Omarchy Linux &amp; Hyprland</text>
    </g>

    <g transform="translate(490, 31)">
      <text font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">
        <tspan fill="#34d399">✓</tspan> Unsandboxed Shell Safe  
        <tspan dx="15" fill="#34d399">✓</tspan> SQLite Local-First  
        <tspan dx="15" fill="#34d399">✓</tspan> E2EE Remote Sync  
        <tspan dx="15" fill="#34d399">✓</tspan> Zero Dependencies
      </text>
    </g>
  </g>
</svg>
